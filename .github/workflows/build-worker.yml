name: Build + push playwright-worker image

# Builds the Hostinger-VPS-hosted scrape worker image and pushes it to GitHub
# Container Registry. Watchtower on the VPS polls the registry and auto-pulls
# updates, so a `git push` to main is the entire deploy flow now — no
# terminal-paste required for worker code changes.
#
# Tag scheme:
#   :latest  — moves on every successful main build (Watchtower follows this)
#   :sha-<short>  — pinned, useful for `docker run` rollbacks
#
# Image is published to:
#   ghcr.io/globerocker/capturepilot-worker
#
# First-time setup: after the first push, go to
#   https://github.com/users/Globerocker/packages/container/capturepilot-worker/settings
# and flip "Change package visibility" to Public. Avoids managing a GHCR pull
# token on the VPS.

on:
  push:
    branches: [main]
    paths:
      - "tools/playwright-worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=ghcr.io/${OWNER_LOWER}/capturepilot-worker" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: tools/playwright-worker
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
